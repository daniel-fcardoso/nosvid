{% extends "videos/layout.html" %}

{% block title %}
    Página não encontrada - Nosvid
{% endblock %}

{% block body %}

<section class="error-page">

    <div class="error-card">

        <div class="error-code">
            404
        </div>

        <h1>
            Página não encontrada
        </h1>

        <p>
            O endereço que você tentou acessar não existe, foi removido
            ou pode ter sido digitado incorretamente.
        </p>

        <a
            href="{% url 'videos:index' %}"
            class="primary-button error-home-button"
        >
            Voltar para o início
        </a>

    </div>

</section>

{% endblock %}
