{% extends "videos/layout.html" %}


{% block title %}
    Editar playlist - Nosvid
{% endblock %}


{% block body %}

<div class="upload-container">

    <div class="upload-card">

        <h1>
            Editar playlist
        </h1>


        {% if message %}

            <div class="message">
                {{ message }}
            </div>

        {% endif %}


        <form method="post">

            {% csrf_token %}


            <div class="form-group">

                <label for="name">
                    Nome
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    maxlength="120"
                    value="{{ playlist.name }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="description">
                    Descrição
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="5"
                >{{ playlist.description }}</textarea>

            </div>


            <div class="form-group playlist-privacy-field">

                <label class="playlist-privacy-option">

                    <input
                        type="checkbox"
                        name="is_private"
                        {% if playlist.is_private %}checked{% endif %}
                    >

                    <span>
                        Playlist privada
                    </span>

                </label>

                <small>
                    Somente você poderá abrir uma playlist privada.
                </small>

            </div>


            <div class="edit-actions">

                <button
                    type="submit"
                    class="primary-button"
                >
                    Salvar alterações
                </button>


                <a
                    href="{% url 'videos:playlist_detail' playlist.id %}"
                    class="cancel-button"
                >
                    Cancelar
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
