{% extends "videos/layout.html" %}

{% block title %}
    Criar conta - Nosvid
{% endblock %}


{% block body %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Criar conta</h1>

        <p class="auth-subtitle">
            Crie sua conta no Nosvid.
        </p>


        {% if message %}

            <div class="message">
                {{ message }}
            </div>

        {% endif %}


        <form method="post">

            {% csrf_token %}


            <div class="form-group">

                <label for="username">
                    Usuário
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Escolha um nome de usuário"
                    required
                    autofocus
                >

            </div>


            <div class="form-group">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Senha
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Crie uma senha"
                    required
                >

            </div>


            <div class="form-group">

                <label for="confirmation">
                    Confirmar senha
                </label>

                <input
                    type="password"
                    id="confirmation"
                    name="confirmation"
                    placeholder="Digite sua senha novamente"
                    required
                >

            </div>


            <button
                type="submit"
                class="primary-button"
            >
                Criar conta
            </button>

        </form>


        <p class="auth-footer">

            Já possui uma conta?

            <a href="{% url 'videos:login' %}">
                Entrar
            </a>

        </p>

    </div>

</div>

{% endblock %}
