{% extends "videos/layout.html" %}

{% block title %}
    Entrar - Nosvid
{% endblock %}


{% block body %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Entrar</h1>

        <p class="auth-subtitle">
            Entre na sua conta do Nosvid.
        </p>


        {% if message %}

            <div class="message">
                {{ message }}
            </div>

        {% endif %}


        <form method="post">

            {% csrf_token %}


            <div class="form-group">

                <label for="username">
                    Usuário
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Digite seu usuário"
                    required
                    autofocus
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Senha
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Digite sua senha"
                    required
                >

            </div>


            <button
                type="submit"
                class="primary-button"
            >
                Entrar
            </button>

        </form>


        <p class="auth-footer">

            Ainda não possui uma conta?

            <a href="{% url 'videos:register' %}">
                Criar conta
            </a>

        </p>

    </div>

</div>

{% endblock %}
